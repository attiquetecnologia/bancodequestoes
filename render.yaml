services:
  - type: web
    name: bancoquestoes-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_PATH
        value: /var/data/bancoquestoes.db
    disk:
      name: bancoquestoes-data
      mountPath: /var/data
      sizeGB: 1
